# Hierarchical Push-T eval at d=75. Long-horizon Tab. 2 sweep.

defaults:
  - pusht_hwm
  - override solver: hcem_d75
  - _self_

plan_config:
  horizon: 15               # low-level pred 15 LeWM blocks = 75 env steps
  receding_horizon: 15
  action_block: 5

eval:
  goal_offset_steps: 75
  eval_budget: 150

output:
  filename: pusht_hwm_d75_results.txt
