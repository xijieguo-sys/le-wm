# Hierarchical Push-T eval at d=50. Long-horizon Tab. 2 sweep.

defaults:
  - pusht_hwm
  - override solver: hcem_d50
  - _self_

plan_config:
  horizon: 10               # low-level pred 10 LeWM blocks = 50 env steps
  receding_horizon: 10
  action_block: 5

eval:
  goal_offset_steps: 50
  eval_budget: 100          # >= horizon * action_block

output:
  filename: pusht_hwm_d50_results.txt
