# Hierarchical CEM for Push-T at goal-offset d=75 (HWM Tab. 10).
_target_: planner.HierarchicalCEMSolver
model_low: ???
model_high: ???
d_l: null
replan_high_every: 1
advance_subgoal: false
subgoal_threshold: null
prior_weight: 0.0
history_size: 3
device: cuda
seed: ${seed}

high_cfg:
  num_samples: 1200
  n_steps: 20
  topk: 10
  var_scale: 1.0
  var_ema: 0.9
  batch_size: 1

low_cfg:
  num_samples: 1200
  n_steps: 20
  topk: 10
  var_scale: 1.0
  var_ema: 0.8
  batch_size: 1

high_plan_cfg:
  horizon: 5                # H = 5 macro-steps
  receding_horizon: 1
  action_block: 1
